name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        env:
          TS_NODE_PROJECT: tsconfig.ts-node.json
        run: |
          set -euo pipefail
          node -r ts-node/register/transpile-only --test test/ 2>&1 | tee out.txt
          # A run that loaded nothing reports zero tests and zero failures.
          tests=$(sed -n 's/^# tests \([0-9]*\)$/\1/p' out.txt | tail -1)
          [ "${tests:-0}" -ge 28 ] || { echo "::error::only ${tests:-0} tests ran"; exit 1; }

  own-firmware:
    # Our own blob-free firmware: built with the stock compiler from firmware/,
    # linked against nothing but itself and libgcc, booted without the ROM.
    runs-on: ubuntu-latest
    env:
      ARDUINO_CLI_VERSION: '1.1.1'
      ESP8266_CORE: 'esp8266:esp8266@3.1.2'
      ESP8266_INDEX: 'https://arduino.esp8266.com/stable/package_esp8266com_index.json'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Install the compiler (from the Arduino ESP8266 package; nothing else of it is used)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/v${ARDUINO_CLI_VERSION}/install.sh \
            | BINDIR="$HOME/bin" sh -s "${ARDUINO_CLI_VERSION}"
          "$HOME/bin/arduino-cli" core update-index --additional-urls "$ESP8266_INDEX"
          "$HOME/bin/arduino-cli" core install "$ESP8266_CORE" --additional-urls "$ESP8266_INDEX"
      - name: Build the programs
        run: |
          set -euo pipefail
          gcc=$(find "$HOME/.arduino15" -name 'xtensa-lx106-elf-gcc' | head -1)
          [ -x "$gcc" ] || { echo "::error::no xtensa-lx106-elf-gcc"; exit 1; }
          mkdir -p out
          for program in blink net-hello; do
            "$gcc" -Os -ffreestanding -nostdlib -nostartfiles -mlongcalls -mtext-section-literals \
              -Wall -Wextra -Werror -I firmware \
              -T firmware/bw8266.ld -L firmware -Wl,-Map,out/$program.map \
              firmware/runtime.c firmware/net.c firmware/$program.c -lgcc -o out/$program.elf
            # Nothing of the SDK or the Arduino core may be linked: only our
            # objects and the compiler's own libgcc.
            if grep -E 'tools/sdk|libmain|libphy|libpp|libnet80211|libwpa|liblwip|cores/esp8266' out/$program.map; then
              echo "::error::$program: the link pulled in SDK or Arduino core code"; exit 1
            fi
            node tools/elf2image.js out/$program.elf out/$program.bin
          done
      - name: Run it without the ROM
        env:
          TS_NODE_PROJECT: tsconfig.ts-node.json
          BW8266_BLINK: out/blink.bin
          BW8266_NET: out/net-hello.bin
        run: |
          set -euo pipefail
          node -r ts-node/register/transpile-only --test test/own-firmware.test.js test/own-net.test.js 2>&1 | tee out.txt
          grep -q '^# pass 3$' out.txt || { echo "::error::the own-firmware tests did not all run and pass"; exit 1; }
          grep -q '^# skipped 0$' out.txt || { echo "::error::an own-firmware test was skipped"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: own-firmware
          path: out/
