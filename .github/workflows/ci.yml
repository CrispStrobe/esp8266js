name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Tests
        env:
          TS_NODE_PROJECT: tsconfig.ts-node.json
        run: |
          set -euo pipefail
          node -r ts-node/register/transpile-only --test test/ 2>&1 | tee out.txt
          # A run that loaded nothing reports zero tests and zero failures.
          tests=$(sed -n 's/^# tests \([0-9]*\)$/\1/p' out.txt | tail -1)
          [ "${tests:-0}" -ge 8 ] || { echo "::error::only ${tests:-0} tests ran"; exit 1; }
